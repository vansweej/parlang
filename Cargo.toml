[workspace]
members = ["crates/*"]
resolver = "2"
default-members = ["crates/parlang"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
combine = "4.6"
clap = { version = "4.5", features = ["derive"] }
rustyline = "14.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
