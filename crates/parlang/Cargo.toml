[package]
name = "parlang"
version = "0.2.0"
edition = "2021"
authors = ["parlang contributors"]
description = "A small ML-alike functional language written in Rust"
license = "MIT"

[dependencies]
combine = { workspace = true }
clap = { workspace = true }
rustyline = { workspace = true }

[dev-dependencies]

[[bin]]
name = "parlang"
path = "src/main.rs"

[lib]
name = "parlang"
path = "src/lib.rs"

[lints]
workspace = true
